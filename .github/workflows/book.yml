name: Book my room

# Runs Canal Booker in the cloud every night. GitHub can start scheduled jobs very late
# (hours, on a bad night), so there are five starts, one an hour from about 7:17 pm Ottawa
# time (6:17 pm in winter). The first one that starts waits (a job can run up to 6 hours)
# and gets ready a couple of minutes before midnight; the later starts queue behind it
# and end with "Nothing to do". :17 avoids the top of the hour, when delays are worst.
# For an exact start time, see "Make the start time reliable" in the README.
on:
  schedule:
    - cron: "17 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = dry run right now (nothing booked). now = really book every open day in the plan right now. book = wait for the next midnight and book. trace = dry run that records the portal's requests (for working on the bot)."
        type: choice
        options: [test, now, book, trace]
        default: test
      dates:
        description: "With now or test: only these days, like 2026-10-02, 2026-10-06. Blank = every open day in the plan."
        type: string
        default: ""
      rooms:
        description: "Optional: rooms to use instead of the plan's, in order, like CB 3102, CB 3201."
        type: string
        default: ""

concurrency:
  group: canal-booker
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # Everyone's copy (fork) runs the newest code from the main repo, so fixes reach the whole
      # group without anyone clicking "Sync fork". Each copy still uses its own password secret.
      # The main repo itself checks out whatever branch was run, so a branch can be tested.
      - uses: actions/checkout@v4
        with:
          repository: silix54/canal-booker
          ref: ${{ github.repository == 'silix54/canal-booker' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # Google Chrome is already on GitHub's machines, so no browser download is needed.
        run: pip install -q "playwright>=1.45" tzdata certifi
      - name: Book
        env:
          CARLETON_USERNAME: ${{ secrets.CARLETON_USERNAME }}
          CARLETON_PASSWORD: ${{ secrets.CARLETON_PASSWORD }}
          TEAM_PLAN_URL: ${{ vars.TEAM_PLAN_URL }}
          ROOMS: ${{ inputs.rooms || vars.ROOMS }}
          STATUS_URL: ${{ vars.STATUS_URL }}
          MODE: ${{ inputs.mode || 'book' }}
          DATES: ${{ inputs.dates }}
        run: python -m app.cloud
